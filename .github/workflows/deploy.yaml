name: deploy to ec2
on:
  push:
    branches:
      -main

jobs:
  deploy:
    runs_on:ubuntu-latest

  steps:
    - name: checkout code
      uses: action/checkout@v6
    - name: deploy via ssh
      uses: applyboy/ssh-action@v1
      with: 
        host: ${{secrets.SSH_HOST}}
        username: ubuntu
        key: ${{secrets.SSH_KEY}}
        script |
          cd ~/Level-5
          git pull
          sudo docker compose down 
          sudo docker compose up -d --build
                               
        
